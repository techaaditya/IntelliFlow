# First-paint defaults for the light-enterprise theme. The full design system
# (and the light/dark toggle) lives in ui/theme.py; these values keep the very
# first frame consistent with it, before our stylesheet is injected.
[theme]
base = "light"
primaryColor = "#1c5cab"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f3f3f0"
textColor = "#0b0b0b"
borderColor = "#e4e3dd"
font = "sans serif"

[browser]
gatherUsageStats = false
